[package]
name = "heron"
version = "0.6.0"
description = "Green multi-pane terminal"
authors = ["seonggyujo"]
license = "MIT"
edition = "2021"

[lib]
# The `_lib` suffix avoids a lib/bin name clash on Windows,
# see https://github.com/rust-lang/cargo/issues/8519
name = "heron_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
portable-pty = "0.9.0"
log = { version = "0.4", features = ["release_max_level_off"] }
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"

# https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
